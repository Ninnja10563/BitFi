name: Build BitFi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >-
          xcodebuild
          -project BitFi.xcodeproj
          -scheme BitFi
          -configuration Debug
          -sdk macosx
          CODE_SIGNING_ALLOWED=NO
          build
